on:
  push:
    tags:
      - '*'

env:
  PIXELVIM_VERSION: 0.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - { os: ubuntu-latest, target: 'x86_64-unknown-linux-gnu', ext: '', name: 'linux' }
          - { os: macos-latest, target: 'x86_64-apple-darwin', ext: '.dmg', name: 'macos' }
          - { os: windows-latest, target: 'x86_64-pc-windows-msvc', ext: '.exe', name: 'windows' }

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.config.target }}
        override: true

    - name: Submodules
      run: git submodule update --init --recursive

    - name: Build
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --release --target=${{ matrix.config.target }}

    - name: Package (MacOS)
      if: ${{ matrix.config.target == 'x86_64-apple-darwin' }}
      run: mkdir assets/macos/pixelvim.app/Contents/MacOS;
           cp target/x86_64-apple-darwin/release/pixelvim assets/macos/pixelvim.app/Contents/MacOS/;
           hdiutil create target/x86_64-apple-darwin/release/pixelvim.dmg -volname pixelvim -srcfolder assets/macos -ov;

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pixelvim_${{ matrix.config.name }}
        path: target/${{ matrix.config.target }}/release/pixelvim${{ matrix.config.ext }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Get version
      run: echo "PIXELVIM_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Install LinuxDeploy
      uses: miurahr/install-linuxdeploy-action@v1

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Package
      working-directory: artifacts
      run: cp ../assets/icon64x64.png pixelvim.png;
           linuxdeploy-x86_64.AppImage --appdir=AppDir -e pixelvim_linux/pixelvim -d ../assets/linux/pixelvim.desktop -i pixelvim.png --output appimage;
           mv pixelvim-x86_64.AppImage pixelvim_linux_${{ env.PIXELVIM_VERSION }}.AppImage;
           mv pixelvim_macos/pixelvim.dmg pixelvim_macos_${{ env.PIXELVIM_VERSION }}.dmg;
           mv pixelvim_windows/pixelvim.exe pixelvim_windows_${{ env.PIXELVIM_VERSION }}.exe;

    - name: Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: artifacts/pixelvim_linux_${{ env.PIXELVIM_VERSION }}.AppImage,
                   artifacts/pixelvim_macos_${{ env.PIXELVIM_VERSION }}.dmg,
                   artifacts/pixelvim_windows_${{ env.PIXELVIM_VERSION }}.exe,
